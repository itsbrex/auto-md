[project]
name = "auto-md"
version = "2.0.0"
description = "Turn codebases and documents into clean Markdown and RAG-ready bundles."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Toolworks" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.14,<2",
  "onnxruntime>=1.20,<2",
  "pathspec>=0.12,<1",
  "pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "rapidocr>=3,<4",
  "starlette>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
automd = "automd.launcher:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automd"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/automd"]
mypy_path = "src"
explicit_package_bases = true
follow_imports = "skip"
